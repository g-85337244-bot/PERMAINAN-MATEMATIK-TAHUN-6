<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏰 数学逃脱密室 - 六年级除法特别版</title>
    <style>
        :root {
            --bg-bright: linear-gradient(135deg, #162447 0%, #1f4068 100%);
            --accent-red: #e43f5a;
            --accent-gold: #ffcc00;
            --accent-cyan: #00e5ff;
            --text-light: #ffffff;
        }

        * { box-sizing: border-box; user-select: none; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-bright);
            color: var(--text-light);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
        }

        .app-container {
            width: 100%;
            max-width: 850px;
            background: rgba(27, 27, 47, 0.95);
            border-radius: 20px;
            box-shadow: 0 0 25px rgba(0, 229, 255, 0.3);
            border: 3px solid var(--accent-cyan);
            padding: 15px;
        }

        .shake { animation: shakeAnim 0.4s ease-in-out; }
        @keyframes shakeAnim {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .view-screen { display: none; flex-direction: column; gap: 12px; }
        .view-screen.active { display: flex; }

        .player-hud {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--accent-red); padding: 8px 14px; border-radius: 12px;
            border: 2px solid var(--accent-gold); font-size: 16px; font-weight: 900;
        }

        .level-bar {
            display: flex; justify-content: space-between; align-items: center;
            background: #0f4c75; padding: 6px 12px; border-radius: 10px;
            border: 2px solid #fff; font-size: 14px; font-weight: bold;
        }

        .ai-speech-box {
            display: flex; align-items: center; gap: 10px; background: #162447;
            padding: 8px 12px; border-radius: 10px; border: 2px solid var(--accent-gold);
            font-size: 14px; font-weight: bold;
        }

        .visual-workspace {
            display: none; background: #0f1423; border-radius: 12px;
            border: 2px solid var(--accent-cyan); padding: 15px;
            flex-direction: column; align-items: flex-start; gap: 8px;
            color: var(--accent-gold); font-size: 15px; line-height: 1.6;
        }
        .visual-workspace.active { display: flex; }

        /* 黑板竖式 Step-by-Step 演练样式 */
        .blackboard-style {
            background: #122117 !important;
            border: 3px dashed #81c784 !important;
            color: #e8f5e9 !important;
            font-family: 'Consolas', 'Courier New', monospace;
        }
        
        .blackboard-title {
            color: var(--accent-gold);
            font-size: 16px;
            font-weight: bold;
            border-bottom: 1px solid #81c784;
            padding-bottom: 6px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* 动态竖式展示容器 */
        .vertical-step-box {
            background: rgba(0,0,0,0.4);
            border: 2px solid #81c784;
            border-radius: 8px;
            padding: 12px 16px;
            font-family: 'Consolas', 'Courier New', monospace;
            font-size: 20px;
            line-height: 1.35;
            letter-spacing: 2px;
            color: #ffff8d;
            margin: 8px 0;
            white-space: pre;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.8);
            animation: glowPulse 0.5s ease-in-out;
        }

        @keyframes glowPulse {
            0% { border-color: var(--accent-cyan); box-shadow: 0 0 12px var(--accent-cyan); }
            100% { border-color: #81c784; box-shadow: inset 0 0 10px rgba(0,0,0,0.8); }
        }

        .step-desc {
            background: rgba(255, 204, 0, 0.15);
            border-left: 4px solid var(--accent-gold);
            padding: 6px 10px;
            color: #ffffff;
            font-size: 15px;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            width: 100%;
            margin-bottom: 5px;
        }

        .audio-btn {
            background: var(--accent-gold); color: #000; border: none;
            padding: 6px 12px; border-radius: 6px; font-weight: bold;
            cursor: pointer; margin-top: 5px; display: inline-flex; align-items: center; gap: 5px;
        }

        .control-btn {
            background: #2e7d32; color: #fff; border: 1px solid #a5d6a7;
            padding: 4px 10px; border-radius: 4px; font-size: 13px; font-weight: bold;
            cursor: pointer; transition: background 0.2s;
        }
        .control-btn:hover { background: #388e3c; }

        .q-card { background: linear-gradient(180deg, #1f4068 0%, #162447 100%); border-radius: 12px; padding: 12px; text-align: center; border: 2px solid var(--accent-gold); }
        .q-text { font-size: 26px; font-weight: 900; color: #fff; }

        .options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-opt {
            background: linear-gradient(180deg, #00e5ff 0%, #0088ff 100%);
            border: 2px solid #ffffff; color: #ffffff; font-size: 20px; font-weight: 900;
            padding: 12px; border-radius: 10px; cursor: pointer; text-shadow: 1px 1px 0px #000;
        }

        .btn-action {
            background: linear-gradient(180deg, #00e676 0%, #00a040 100%); color: white; border: 2px solid #ffffff;
            padding: 12px; font-size: 18px; font-weight: 900; border-radius: 10px; cursor: pointer; width: 100%;

        .report-card {

        .report-table { width: 100%; border-collapse: collapse; margin-bottom: 15px; font-size: 14px; }
        .report-table th, .report-table td { border: 1px solid #333; padding: 6px; text-align: center; }
        .report-table th { background: #f0f0f0; }

        @media print {
            body { background: none; color: #000; }
            .app-container { border: none; box-shadow: none; width: 100%; max-width: 100%; padding: 0; }
            .no-print { display: none !important; }
            .report-card { box-shadow: none; border: none; }
        }
    </style>
</head>

    class SoundEngine {
        constructor() { this.ctx = null; }
        init() { if(!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
        playDing() {
            this.init();
            const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
            osc.type = 'sine'; osc.frequency.setValueAtTime(523.25, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1046.50, this.ctx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(); osc.stop(this.ctx.currentTime + 0.3);
        }
        playBuzz() {
            this.init();
            const osc = this.ctx.createOscillator(), gain = this.ctx.createGain();
            osc.type = 'sawtooth'; osc.frequency.setValueAtTime(160, this.ctx.currentTime);
            gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.3);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(); osc.stop(this.ctx.currentTime + 0.3);
        }
    }
    const soundAudio = new SoundEngine();

            verticalSteps: [
                {

    let currentQIndex = 0;
    let playerData = { name: '', classInfo: '', score: 0 };
    let currentAiLevel = 1; 
    let startTime = null;
    let studentLogs = [];
    
    // 竖式 Step-by-Step 控制变量
    let currentStepIndex = 0;
    let autoStepTimer = null;

    function startGame() {
        playerData.name = document.getElementById('input-name').value || "无名";
        playerData.classInfo = document.getElementById('input-class').value || "未填写";
        document.getElementById('hud-name').innerText = playerData.name;
        startTime = new Date();
        studentLogs = [];
        showScreen('screen-game');
        loadQuestion();
    }

    function showScreen(id) {
        document.querySelectorAll('.view-screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
    }

    function loadQuestion() {
        currentAiLevel = 1;
        stopAutoStep();
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        const q = divQuestions[currentQIndex];
        document.getElementById('level-indicator').innerText = `${currentQIndex + 1}/${divQuestions.length}`;
        document.getElementById('q-text').innerText = `${currentQIndex + 1}. ${q.q}`;
        renderOptions(q.opts, q.ans);
        updateAiUI();
    }

    function renderOptions(opts, correct) {
        const grid = document.getElementById('options-grid');
        grid.innerHTML = '';
        const shuffled = [...opts].sort(() => Math.random() - 0.5);
        shuffled.forEach((opt, i) => {
            const btn = document.createElement('button');
            btn.className = 'btn-opt';
            btn.innerText = `${String.fromCharCode(65 + i)}. ${opt}`;
            btn.onclick = () => handleAnswer(opt === correct, opt);
            grid.appendChild(btn);
        });
    }

    function handleAnswer(isCorrect, selectedOpt) {
        if (!studentLogs[currentQIndex]) {
            studentLogs[currentQIndex] = {
                qIndex: currentQIndex + 1,
                question: divQuestions[currentQIndex].q,
                correctAns: divQuestions[currentQIndex].ans,
                firstTry: selectedOpt,
                isFirstTryCorrect: isCorrect,
                neededHelper: '🟢 独立完成'
            };
        }

        if (isCorrect) {
            soundAudio.playDing();
            stopAutoStep();
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            
            let addScore = 10;
            if(currentAiLevel === 2) addScore = 7;
            if(currentAiLevel === 3) addScore = 4;

            playerData.score += addScore;
            document.getElementById('hud-coins').innerText = playerData.score;
            
            currentQIndex++;
            if (currentQIndex < divQuestions.length) {
                loadQuestion();
            } else {
                finishGame();
            }
        } else {
            soundAudio.playBuzz();
            
            if (currentAiLevel === 1) {
                currentAiLevel = 2;
                studentLogs[currentQIndex].neededHelper = '🟡 语音引导';
            } else if (currentAiLevel === 2) {
                currentAiLevel = 3;
                studentLogs[currentQIndex].neededHelper = '🔴 竖式逐笔演练';
            }

            document.getElementById('app-container').classList.add('shake');
            setTimeout(() => document.getElementById('app-container').classList.remove('shake'), 400);
            updateAiUI();
        }
    }

    function updateAiUI() {
        const badge = document.getElementById('ai-level-badge');
        const speech = document.getElementById('ai-speech');
        const workspace = document.getElementById('visual-workspace');
        const currentQ = divQuestions[currentQIndex];

        stopAutoStep();
        workspace.classList.remove('blackboard-style');

        if (currentAiLevel === 1) {
            badge.innerText = `🟢 Level 1：独立挑战`;
            speech.innerText = "仔细计算，选择正确答案！";
            workspace.classList.remove('active');
        } 
        else if (currentAiLevel === 2) {
            badge.innerText = `🟡 Level 2：AI 老师分步思路引导`;
            speech.innerText = "请听 AI 老师的解题思路引导，重新尝试回答！";
            workspace.classList.add('active');
            
            workspace.innerHTML = `
                <div>${currentQ.stepsHtml}</div>
                <button class="audio-btn" onclick="speakText(divQuestions[currentQIndex].speechText)">🔊 再次播放 AI 老师语音引导</button>
            `;

            speakText(currentQ.speechText);
        }
        else if (currentAiLevel === 3) {
            badge.innerText = `🔴 Level 3：竖式 Step-by-Step 逐笔推导`;
            speech.innerText = "仔细观察黑板上竖式一步步写出的过程！";
            workspace.classList.add('active', 'blackboard-style');

            initStepByStepBoard(currentQ);
        }
    }

    // ⚡ 初始化 Step-by-Step 动态黑板
    function initStepByStepBoard(q) {
        const workspace = document.getElementById('visual-workspace');
        currentStepIndex = 0;

        workspace.innerHTML = `
            <div class="blackboard-title">
                <span>📋 竖式 Step-by-Step 逐笔黑板演练</span>
                <div style="display:flex; gap:6px;">
                    <button class="control-btn" onclick="prevStep()">◀️ 上一步</button>
                    <button class="control-btn" onclick="nextStep()">▶️ 下一步</button>
                    <button class="control-btn" style="background:#0288d1;" onclick="replaySteps()">⏯️ 重播</button>
                </div>
            </div>
            
            <div id="step-desc-display" class="step-desc">--</div>
            
            <div id="vertical-art-display" class="vertical-step-box">--</div>

            <button class="audio-btn" style="background:#81c784; color:#000;" onclick="speakText(divQuestions[currentQIndex].boardSpeech)">🔊 再次播放语音讲解</button>
        `;

        renderCurrentStep(q);
        speakText(q.boardSpeech);

        // 自动播放 Timer (每 1.3 秒推进一步竖式)
        autoStepTimer = setInterval(() => {
            if (currentStepIndex < q.verticalSteps.length - 1) {
                currentStepIndex++;
                renderCurrentStep(q);
            } else {
                stopAutoStep();
            }
        }, 1300);
    }

    function renderCurrentStep(q) {
        const stepData = q.verticalSteps[currentStepIndex];
        if (!stepData) return;

        document.getElementById('step-desc-display').innerText = `[${currentStepIndex + 1}/${q.verticalSteps.length}] ${stepData.desc}`;
        
        const artBox = document.getElementById('vertical-art-display');
        artBox.innerText = stepData.art;
        
        // 触发 CSS 闪烁动画重置
        artBox.style.animation = 'none';
        artBox.offsetHeight; 
        artBox.style.animation = null; 
    }

    function nextStep() {
        stopAutoStep();
        const q = divQuestions[currentQIndex];
        if (currentStepIndex < q.verticalSteps.length - 1) {
            currentStepIndex++;
            renderCurrentStep(q);
        }
    }

    function prevStep() {
        stopAutoStep();
        const q = divQuestions[currentQIndex];
        if (currentStepIndex > 0) {
            currentStepIndex--;
            renderCurrentStep(q);
        }
    }

    function replaySteps() {
        stopAutoStep();
        const q = divQuestions[currentQIndex];
        currentStepIndex = 0;
        renderCurrentStep(q);

        autoStepTimer = setInterval(() => {
            if (currentStepIndex < q.verticalSteps.length - 1) {
                currentStepIndex++;
                renderCurrentStep(q);
            } else {
                stopAutoStep();
            }
        }, 1300);
    }

    function stopAutoStep() {
        if (autoStepTimer) {
            clearInterval(autoStepTimer);
            autoStepTimer = null;
        }
    }


    /* ============================================================
       DME Google Sheet 连线（只增加数据发送，不修改原有题目）
       模块：BAHAGI / 除法
       ============================================================ */
    const DME_GOOGLE_SHEET_API = "https://script.google.com/macros/s/AKfycbw5ryHEgJkxPnrIfw97SUT23Poj-c86vzPqDKIlROW3HhIyWUoB16PVs4uFzI4rcHWM/exec";

    function sendBahagiToGoogleSheet(durationSec) {
        const firstTryCorrectCount = studentLogs.filter(
            l => l && l.isFirstTryCorrect
        ).length;

        // 本原始游戏没有独立的 TP3 题目区，因此 TP3 不虚构数据。
        // L1 = 第 1–5 题；L2 = 第 6–10 题。
        const l1Logs = studentLogs.filter(l => l && l.qIndex >= 1 && l.qIndex <= 5);
        const l2Logs = studentLogs.filter(l => l && l.qIndex >= 6 && l.qIndex <= 10);

        const digitalL1 = l1Logs.filter(l => l.isFirstTryCorrect).length;
        const digitalL2 = l2Logs.filter(l => l.isFirstTryCorrect).length;

        // 每一道题第一次答错后进入 AI 辅助，因此这里记录需要辅助的题目数量。
        const aiHelps = studentLogs.filter(
            l => l && l.neededHelper !== '🟢 独立完成'
        ).length;

        const payload = {
            operation: "Bahagi",
            module: "Bahagi",
            name: playerData.name,
            className: playerData.classInfo,

            digitalL1: digitalL1,
            digitalL1TP: digitalL1 >= 3 ? "TP3" : (digitalL1 >= 1 ? "TP2" : "TP1"),

            digitalL2: digitalL2,
            digitalL2TP: digitalL2 >= 3 ? "TP3" : (digitalL2 >= 1 ? "TP2" : "TP1"),

            aiHelps: aiHelps,
            digitalTime: `${Math.floor(durationSec / 60)} 分钟 ${durationSec % 60} 秒`,

            // 原游戏没有独立 TP3 /2 题目，所以不发送 digitalTP3。
            source: "BAHAGI_TAHUN6_ORIGINAL",
            submittedAt: new Date().toISOString()
        };

        return fetch(DME_GOOGLE_SHEET_API, {
            method: "POST",
            mode: "no-cors",
            headers: {
                "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(payload)
        }).then(() => {
            console.log("✅ Bahagi 成绩已发送到 Google Sheet");
        }).catch(error => {
            console.error("❌ Bahagi Google Sheet 发送失败：", error);
        });
    }

    function finishGame() {
        stopAutoStep();
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
        const endTime = new Date();
        const durationSec = Math.round((endTime - startTime) / 1000);
        const firstTryCorrectCount = studentLogs.filter(l => l && l.isFirstTryCorrect).length;
        const accuracy = Math.round((firstTryCorrectCount / divQuestions.length) * 100);

        document.getElementById('rep-name').innerText = playerData.name;
        document.getElementById('rep-class').innerText = playerData.classInfo;
        document.getElementById('rep-date').innerText = endTime.toLocaleDateString() + " " + endTime.toLocaleTimeString();
        document.getElementById('rep-time').innerText = `${Math.floor(durationSec / 60)}分${durationSec % 60}秒`;
        document.getElementById('rep-score').innerText = playerData.score;
        document.getElementById('rep-accuracy').innerText = `${accuracy}% (${firstTryCorrectCount}/${divQuestions.length})`;

        let comment = "表现完美！除法概念清晰，能看懂竖式细节并矫正错误！";
        if (accuracy < 60) comment = "基础尚需巩固，建议重复观看竖式 Step-by-Step 推导动画！";
        else if (accuracy < 90) comment = "表现良好！在观看竖式推演后能快速理解，继续保持！";
        document.getElementById('rep-comment').innerText = comment;

        let tableHtml = '';
        studentLogs.forEach(log => {
            if(!log) return;
            tableHtml += `<tr>
                <td>${log.qIndex}</td>
                <td>${log.question}</td>
                <td>${log.correctAns}</td>
                <td style="color:${log.isFirstTryCorrect ? 'green' : 'red'}; font-weight:bold;">${log.firstTry}</td>
                <td>${log.neededHelper}</td>
            </tr>`;
        });
        document.getElementById('rep-table-body').innerHTML = tableHtml;

        // 完成报告后发送 Google Sheet；不改变原有题目与答题流程。
        sendBahagiToGoogleSheet(durationSec);

        showScreen('screen-report');
    }
</script>
